timeout: 10m
dependency-tree: true
list-all-pkgs: true
exit-code: 1
severity:
  - HIGH
  - CRITICAL
scan:
  scanners:
    - vuln
    - secret
    - misconfig
    - license
vulnerability:
  ignore-unfixed: true
pkg:
  types:
    - os
    - library
license:
  # Next.js optionally installs LGPL libvips binaries through Sharp. This project
  # exports static pages with image optimization disabled and does not ship them.
  ignored:
    - LGPL-3.0-or-later
